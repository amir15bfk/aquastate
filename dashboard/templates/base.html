{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081012">
  {% include "partials/theme_head.html" %}
  <title>{% block title %}Dam simulator · AquaState{% endblock %}</title>
  <link rel="icon" href="{% static 'ds/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/fonts.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/maplibre-gl.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20261113-3">
  <link rel="stylesheet" href="{% static 'ds/ds.css' %}">
  <link rel="stylesheet" href="{% static 'ds/pages.css' %}">
  <link rel="stylesheet" href="{% static 'ds/themes.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body
  class="pilot-page with-site-bar"
  hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
>
  <a class="skip-link" href="#panel-shell">Skip to the dam panel</a>
  {% include "partials/site_bar.html" %}
  {% block content %}{% endblock %}
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'vendor/alpine.min.js' %}" defer></script>
  <script src="{% static 'js/map.js' %}?v=3" defer></script>
  <script src="{% static 'js/charts.js' %}" defer></script>
  <script src="{% static 'js/dashboard.js' %}" defer></script>
  <script src="{% static 'ds/ds.js' %}" defer></script>
  {% block extra_body %}{% endblock %}
</body>
</html>
