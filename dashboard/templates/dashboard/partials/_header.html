{% load static %}
<header class="topbar">
  <a class="brand" href="/" aria-label="AquaState home">
    <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 3.5c5.4 6.5 9 11.2 9 16.1A9 9 0 0 1 7 19.6c0-4.9 3.6-9.6 9-16.1Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M11.5 20.2c.4-3.4 2.1-6.3 4.5-8.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    <span class="brand__text">
      <span class="brand__name">AquaState</span>
      <span class="brand__sub">Hydrological Resilience Index</span>
    </span>
  </a>

  <nav class="country-switch" aria-label="Country">
    {% for item in countries %}
      <a class="country-tab {% if item.iso3 == country.iso3 %}is-active{% endif %}"
         href="?country={{ item.iso3 }}"
         {% if item.iso3 == country.iso3 %}aria-current="page"{% endif %}>
        {{ item.iso3 }}
      </a>
    {% endfor %}
  </nav>

  <div class="topbar__right">
    <div class="data-badge"><span class="data-badge__dot"></span>Deterministic MVP · seeded</div>
    {% if selected_dam %}
      <div class="as-of">As of {{ state.as_of }}</div>
    {% endif %}
  </div>
</header>
